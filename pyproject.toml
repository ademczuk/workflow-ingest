[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-ingest"
version = "0.1.0"
description = "Workflow-aware idea router for digest-derived patterns"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "rank-bm25>=0.2.1"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
