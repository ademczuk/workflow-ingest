# Routing rules for the matcher.
# When a digest produces N candidate patterns, route each by best-match keyword
# overlap. Tie-break by `priority` here (lower = match first).

routing_rules:
  match_threshold_jaccard: 0.15  # min keyword overlap to consider a hit
  novelty_threshold_jaccard: 0.10  # below this against canonical, mark as novel
  multi_match_resolution: "all"  # if a concept hits multiple subsystems, write to all (cross-cutting goes to Harness-Insights)
  priority_order:
    - solve-room       # boardroom-level concepts win first (they often subsume others)
    - anismin
    - meridian
    - kimiclaw
    - brutal-harness
    - visual-llm
    - clawfish
    - trident
