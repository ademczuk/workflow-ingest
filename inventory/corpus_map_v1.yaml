# Sourced from C:\Projects\_Github\Obsidian\...\02-Knowledge\Wiki\
# and ~/.claude/projects/<proj>/memory/  on 2026-05-06.
#
# Schema: validates against inventory/corpus_schema_v1.yaml.
# This is NOT the same shape as inventory/snapshot_schema_v1.yaml — the two
# files serve different jobs. Snapshot tracks subsystem provenance ("when
# did I last see evidence for this slug"). Corpus map is the routing config
# the matcher consults at decision time.
#
# Each subsystem is one routing target. The matcher uses `keywords` for
# scoring against the digest's notable visuals + notable spoken content +
# key points. `concepts` is for cross-system overlap detection (e.g.
# "context rot" can matter to multiple subsystems).
#
# `obsidian_canonical` is the file the digester reads before declaring a
# concept novel. `obsidian_operational` is the existing pages where routed
# patterns can append a "Mentioned in [video] [MM:SS]" entry.
# `write_target_when_novel` is where to drop a stub note for genuinely-new
# concepts (verified by reading the canonical, not by score alone).
#
# Slug-validation: the matcher fails loud if a slug here is not also in the
# current snapshot.yaml. This catches stale corpus_map shipped alongside a
# newer snapshot routing to dead subsystems.

